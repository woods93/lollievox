<body>

  <a class="logo" href="index.html"><img src="img/lollievox-logo.png" alt="LollieVox" width="1800" height="450"></a>
  <nav aria-label="Main"><ul><li><a href="index.html">Home</a></li><li><a href="https://music.lollievox.com" target="_blank" rel="noopener">Music</a></li><li><a href="https://www.youtube.com/user/Lollievox" target="_blank" rel="noopener">YouTube</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>

<main id="content">

<article class="prose">
  <h1>Contact</h1>
  <dl class="info contact-list">
    <dt>Booking/Management</dt><dd><a class="mail" data-u="lollievox" data-d="lollievox.com" href="#">email</a></dd>
    <dt>Remix/Vocal Inquiries</dt><dd><a class="mail" data-u="lollievox" data-d="lollievox.com" href="#">email</a></dd>
    <dt>General Inquiries</dt><dd><a class="mail" data-u="laurie" data-d="lollievox.com" href="#">email</a></dd>
  </dl>
  <form id="contact-form" class="form" action="https://api.web3forms.com/submit" method="POST" data-key="">
    <input type="hidden" name="access_key" value="">
    <input type="hidden" name="subject" value="New message from the LollieVox website">
    <input type="hidden" name="from_name" value="LollieVox website">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>Your name (required)<input name="name" required autocomplete="name"></label>
    <label>Your email (required)<input type="email" name="email" required autocomplete="email"></label>
    <label>Subject<input name="subject_line"></label>
    <label>Your message<textarea name="message" rows="6" required></textarea></label>
    <button class="btn" type="submit">Send</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</article>

<section class="listen">
  <div class="embed">
    <h2>Listen now</h2>
    <iframe title="LollieVox on Bandcamp" src="https://bandcamp.com/EmbeddedPlayer/album=2828031416/size=large/bgcol=333333/linkcol=9a64ff/minimal=true/transparent=true/" seamless loading="lazy"
      style="border:0;width:100%;height:470px"></iframe>
  </div>
  <div class="embed">
    <h2>FL Studio 20 Official Demo Song</h2>
    <div class="video"><iframe title="FL Studio 20 Official Demo Song" src="https://www.youtube-nocookie.com/embed/6J58nEsRAwQ?rel=0" loading="lazy"
      allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <p class="follow"><a href="https://www.facebook.com/Lollievox" target="_blank" rel="noopener">Follow LollieVox on Facebook</a></p>
  </div>
</section>
